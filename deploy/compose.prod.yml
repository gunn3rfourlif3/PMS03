# Production stack for a single VPS: Caddy (TLS) -> web + api, with Postgres & Redis.
# Only Caddy publishes ports (80/443); everything else stays on the internal network.
#
#   docker compose -f deploy/compose.prod.yml --env-file deploy/.env.prod up -d --build
#
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api, tenant, landlord, marketing]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: pms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3000
      # App connects as the least-privileged role so Row-Level Security is enforced
      # (pms is a superuser and would BYPASS RLS). Migrations use the owner URL below.
      DATABASE_URL: postgres://pms_app:pms_app@postgres:5432/pms
      MIGRATION_DATABASE_URL: postgres://pms:${POSTGRES_PASSWORD}@postgres:5432/pms
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?set PII_ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      OTP_CHANNEL: ${OTP_CHANNEL:-email}
      # "Remember this device" lifetime (days); 0 disables. Lets returning users
      # re-auth without a fresh (paid) OTP.
      TRUSTED_DEVICE_DAYS: ${TRUSTED_DEVICE_DAYS:-30}
      # Ordered delivery cascade for OTPs + tenant welcome (whatsapp,email). Falls
      # back left→right; WhatsApp is skipped until WHATSAPP_TOKEN is set.
      OTP_CHANNELS: ${OTP_CHANNELS:-whatsapp,email}
      WELCOME_CHANNELS: ${WELCOME_CHANNELS:-}
      # WhatsApp Cloud API (Meta, direct — no BSP). Blank ⇒ channel off (email-only).
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      WHATSAPP_OTP_TEMPLATE: ${WHATSAPP_OTP_TEMPLATE:-locare_otp}
      WHATSAPP_WELCOME_TEMPLATE: ${WHATSAPP_WELCOME_TEMPLATE:-locare_welcome}
      WHATSAPP_TEMPLATE_LANG: ${WHATSAPP_TEMPLATE_LANG:-en}
      # Providers (blank -> safe stub). See deploy/.env.prod.example.
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM: ${SENDGRID_FROM:-}
      # SMTP (e.g. HostAfrica) — takes precedence over SendGrid when SMTP_HOST is set.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-ikhokha}
      IKHOKHA_APP_ID: ${IKHOKHA_APP_ID:-}
      IKHOKHA_APP_SECRET: ${IKHOKHA_APP_SECRET:-}
      IKHOKHA_ENTITY_ID: ${IKHOKHA_ENTITY_ID:-}
      IKHOKHA_MODE: ${IKHOKHA_MODE:-live}
      # Callback signature check: off | monitor (verify+log, still process) | enforce (reject bad sig)
      IKHOKHA_VERIFY_CALLBACK: ${IKHOKHA_VERIFY_CALLBACK:-off}
      IKHOKHA_REQUESTER_URL: ${IKHOKHA_REQUESTER_URL:-}
      IKHOKHA_CALLBACK_URL: ${IKHOKHA_CALLBACK_URL:-}
      IKHOKHA_SUCCESS_URL: ${IKHOKHA_SUCCESS_URL:-}
      IKHOKHA_FAIL_URL: ${IKHOKHA_FAIL_URL:-}
      IKHOKHA_CANCEL_URL: ${IKHOKHA_CANCEL_URL:-}
      PAYOUT_PROVIDER: ${PAYOUT_PROVIDER:-paystack}
      PAYFAST_MERCHANT_ID: ${PAYFAST_MERCHANT_ID:-}
      PAYFAST_MERCHANT_KEY: ${PAYFAST_MERCHANT_KEY:-}
      PAYFAST_PASSPHRASE: ${PAYFAST_PASSPHRASE:-}
      PAYFAST_SANDBOX: ${PAYFAST_SANDBOX:-false}
      STITCH_WEBHOOK_SECRET: ${STITCH_WEBHOOK_SECRET:-}
      LEADS_NOTIFY_EMAIL: ${LEADS_NOTIFY_EMAIL:-}
      PARTNER_NOTIFY_EMAIL: ${PARTNER_NOTIFY_EMAIL:-partners@locare.co.za}
      PARTNER_APPLY_URL: ${PARTNER_APPLY_URL:-https://app.locare.co.za/partner-apply}
      # POPIA retention: purge PII from rejected partner applications after N days.
      PARTNER_APP_RETENTION_DAYS: ${PARTNER_APP_RETENTION_DAYS:-90}
      TENANT_APP_URL: ${TENANT_APP_URL:-https://app.locare.co.za}
      # Google (social) sign-in — additive to OTP. AUTH_BASE is the single host
      # whose /api/auth/google/callback is registered in Google Cloud.
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_BASE: ${AUTH_BASE:-https://api.locare.co.za}
      # Platform-admin allowlist (comma-separated emails) for the Locare platform.
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      # Photo/file storage on a persistent disk volume, served from GET /media/:key.
      MEDIA_DIR: /data/media
      PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:?set NEXT_PUBLIC_API_BASE}
      # Base URL for the lease e-signing page (the back-office web origin).
      SIGN_BASE: ${SIGN_BASE:-}
      # Smart lease parsing. Default 'heuristic' (no key). Set 'anthropic' + key for LLM accuracy.
      DOCUMENT_AI_PROVIDER: ${DOCUMENT_AI_PROVIDER:-heuristic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DOCUMENT_AI_MODEL: ${DOCUMENT_AI_MODEL:-}
      DOCUMENT_AI_TIMEOUT_MS: ${DOCUMENT_AI_TIMEOUT_MS:-45000}
      DOCUMENT_AI_MAX_RETRIES: ${DOCUMENT_AI_MAX_RETRIES:-2}
    volumes:
      - mediadata:/data/media

  web:
    build:
      context: ../web-admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:?set NEXT_PUBLIC_API_BASE}
    restart: unless-stopped
    depends_on: [api]

  # Tenant mobile app served as a static web bundle (Expo web export).
  tenant:
    build:
      context: ../mobile-tenant
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:?set NEXT_PUBLIC_API_BASE}
    restart: unless-stopped
    depends_on: [api]

  # Landlord mobile app served as a static web bundle (Expo web export).
  landlord:
    build:
      context: ../mobile-landlord
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:?set NEXT_PUBLIC_API_BASE}
    restart: unless-stopped
    depends_on: [api]

  # Static marketing / product website.
  marketing:
    build:
      context: ../marketing
      dockerfile: Dockerfile
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  mediadata:
