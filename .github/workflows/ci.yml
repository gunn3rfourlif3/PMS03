name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint "{src,test}/**/*.ts"
        continue-on-error: true
      - name: Unit tests
        run: npm test -- --ci
      - name: Build (type-checks via tsc)
        run: npm run build

      # Supply-chain gate. Fails only on CRITICAL so a transitive moderate can't
      # block a hotfix; review the report for high/moderate findings.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=critical
      - name: Audit report (visible, non-blocking)
        run: npm audit --omit=dev || true

  web:
    name: Web console (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-admin/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Build (type-checks + bundle)
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:3000/api
