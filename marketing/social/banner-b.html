<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:'PJS'; src:url('fonts/pjs-400.woff2') format('woff2'); font-weight:400; font-display:block; }
  @font-face { font-family:'PJS'; src:url('fonts/pjs-600.woff2') format('woff2'); font-weight:600; font-display:block; }
  @font-face { font-family:'PJS'; src:url('fonts/pjs-800.woff2') format('woff2'); font-weight:800; font-display:block; }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:2560px; height:1440px; overflow:hidden; }

  .stage {
    position:relative; width:2560px; height:1440px;
    background:
      radial-gradient(1150px 620px at 50% 45%, #ffffff 0%, rgba(255,255,255,0) 72%),
      radial-gradient(1700px 1100px at 50% 44%, #f4f8fb 0%, #e9f0f5 58%, #dde8ef 100%);
    font-family:'PJS', sans-serif;
    overflow:hidden;
  }
  .motif { position:absolute; inset:0; width:2560px; height:1440px; }

  .safe {
    position:absolute; left:507px; top:508px; width:1546px; height:423px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }

  .wm { width:540px; height:180px; display:block; }
  .tag {
    margin-top:30px;
    font-size:40px; font-weight:400; letter-spacing:.005em;
    color:rgba(22,24,29,.74);
  }
  .rule { margin-top:26px; width:132px; height:2px; background:rgba(45,106,143,.34); }
  .kicker {
    margin-top:25px;
    font-size:19px; font-weight:600; letter-spacing:.20em;
    color:rgba(45,106,143,.80); text-transform:uppercase;
  }
  .kicker span { color:rgba(45,106,143,.38); margin:0 12px; }
</style>
</head>
<body>
<div class="stage">

  <svg class="motif" viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Fade the drafting grid out behind the wordmark so the centre reads clean.
           An SVG mask keys off LUMINANCE, not alpha: black hides, white shows.
           Black-with-varying-alpha is black all the way through, so it hides
           everything and the motif silently disappears. Ramp black -> white. -->
      <radialGradient id="fade" cx="50%" cy="47%" r="62%">
        <stop offset="0%"   stop-color="#000000"/>
        <stop offset="34%"  stop-color="#1a1a1a"/>
        <stop offset="70%"  stop-color="#b4b4b4"/>
        <stop offset="100%" stop-color="#ffffff"/>
      </radialGradient>
      <mask id="gridmask"><rect width="2560" height="1440" fill="url(#fade)"/></mask>
      <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
        <path d="M64 0H0v64" fill="none" stroke="#2D6A8F" stroke-width="1" stroke-opacity=".26"/>
      </pattern>
      <!-- A light-background gradient bands worse than a dark one; grain hides it. -->
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
    </defs>

    <rect width="2560" height="1440" fill="url(#grid)" mask="url(#gridmask)"/>

    <!-- Same rounded-square motif as the dark cut, drawn in brand blue. -->
    <g stroke="#2D6A8F" fill="none" stroke-width="2.5" mask="url(#gridmask)">
      <g transform="rotate(-8 330 1090)" opacity=".34">
        <rect x="10"   y="770" width="640"  height="640"  rx="140"/>
        <rect x="-80"  y="680" width="820"  height="820"  rx="179"/>
        <rect x="-170" y="590" width="1000" height="1000" rx="219"/>
      </g>
      <g transform="rotate(8 2230 350)" opacity=".34">
        <rect x="1910" y="30"   width="640"  height="640"  rx="140"/>
        <rect x="1820" y="-60"  width="820"  height="820"  rx="179"/>
        <rect x="1730" y="-150" width="1000" height="1000" rx="219"/>
      </g>
    </g>

    <rect width="2560" height="1440" filter="url(#grain)" opacity=".05"/>
  </svg>

  <div class="safe">
    <img class="wm" src="wordmark-brand.svg" alt="Locare">
    <div class="tag">Property management, beautifully run.</div>
    <div class="rule"></div>
    <div class="kicker">Product demos<span>&middot;</span>Onboarding training<span>&middot;</span>locare.co.za</div>
  </div>

</div>
</body>
</html>
